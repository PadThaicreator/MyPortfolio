services:
  poonnawit-portfolio:
    image: ghcr.io/padthaicreator/myportfolio:0.0.0
    container_name: poonnawit-portfolio
    restart: unless-stopped

    ports:
      - "8080:80"

    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
